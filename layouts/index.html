<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ .Params.description | default .Site.Params.description }}">
  <meta name="theme-color" content="#11152b">
  <title>{{ .Title }}</title>
  <style>
    :root {
      --ink: #090b17;
      --ink-soft: #11152b;
      --panel: rgba(22, 27, 52, 0.82);
      --parchment: #f3efe4;
      --muted: #b8bdd0;
      --violet: #b8a1ff;
      --violet-deep: #7457c8;
      --gold: #e9c66f;
      --teal: #67d9cb;
      --line: rgba(184, 161, 255, 0.22);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--parchment);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.72;
      background:
        radial-gradient(circle at 82% 5%, rgba(116, 87, 200, 0.18), transparent 29rem),
        radial-gradient(circle at 8% 34%, rgba(103, 217, 203, 0.09), transparent 25rem),
        linear-gradient(rgba(184, 161, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(184, 161, 255, 0.035) 1px, transparent 1px),
        var(--ink);
      background-size: auto, auto, 42px 42px, 42px 42px, auto;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, transparent, rgba(4, 5, 12, 0.42));
      z-index: -1;
    }

    .site-header {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 30px 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      color: var(--parchment);
      text-decoration: none;
    }

    .sigil {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: var(--gold);
      border: 1px solid rgba(233, 198, 111, 0.65);
      transform: rotate(45deg);
      background: rgba(233, 198, 111, 0.06);
      box-shadow: 0 0 24px rgba(233, 198, 111, 0.11);
    }

    .sigil span { transform: rotate(-45deg); font-family: Georgia, serif; font-size: 21px; }

    .brand-copy strong {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.28rem;
      letter-spacing: 0.055em;
    }

    .brand-copy small,
    .header-note {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    main {
      width: min(1040px, calc(100% - 40px));
      margin: 0 auto;
      padding: 82px 0 70px;
    }

    .hero-copy { max-width: 910px; margin-bottom: 48px; }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--gold);
      font-size: 0.74rem;
      font-weight: 750;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1, h2, h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      line-height: 1.13;
    }

    h1 {
      margin: 0;
      max-width: 900px;
      font-size: clamp(3.1rem, 8vw, 6.6rem);
      letter-spacing: -0.055em;
    }

    h1 span { color: var(--violet); }

    h2 {
      margin: 92px 0 22px;
      max-width: 800px;
      color: var(--parchment);
      font-size: clamp(2rem, 4.4vw, 3.45rem);
      letter-spacing: -0.035em;
    }

    h2::before {
      content: "✦";
      display: block;
      margin-bottom: 13px;
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 1rem;
      letter-spacing: 0;
    }

    h3 { margin: 10px 0 12px; font-size: 1.35rem; color: var(--parchment); }
    p { color: var(--muted); }

    .lead {
      max-width: 820px;
      margin: 30px 0 26px;
      font-size: clamp(1.12rem, 2vw, 1.4rem);
      color: #d9d9e6;
    }

    strong { color: var(--parchment); }
    em { color: #d8cdfa; }

    .fact-row { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 28px; }

    .fact-row span {
      padding: 7px 12px;
      color: var(--teal);
      border: 1px solid rgba(103, 217, 203, 0.3);
      border-radius: 999px;
      background: rgba(103, 217, 203, 0.055);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    img, video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 680px;
      margin: 48px auto;
      object-fit: contain;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #060812;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38), 0 0 0 1px rgba(233, 198, 111, 0.04) inset;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 38px 0 12px;
    }

    .feature-grid article {
      min-height: 250px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(145deg, rgba(25, 31, 59, 0.9), rgba(15, 18, 37, 0.86));
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
    }

    .feature-grid article:nth-child(2n) { border-color: rgba(103, 217, 203, 0.18); }

    .feature-number {
      color: var(--gold);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
    }

    .feature-grid p { margin-bottom: 0; font-size: 0.96rem; }

    ul { margin: 24px 0; padding: 0; list-style: none; }

    li {
      position: relative;
      margin: 0;
      padding: 16px 16px 16px 34px;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }

    li:last-child { border-bottom: 1px solid var(--line); }
    li::before { content: "◇"; position: absolute; left: 7px; color: var(--gold); }

    footer {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 42px;
      color: #777d96;
      border-top: 1px solid var(--line);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    ::selection { color: var(--ink); background: var(--gold); }

    @media (max-width: 720px) {
      .site-header { align-items: flex-start; }
      .header-note { display: none; }
      main { padding-top: 58px; }
      .feature-grid { grid-template-columns: 1fr; }
      .feature-grid article { min-height: 0; }
      h2 { margin-top: 70px; }
      img, video { margin: 36px auto; border-radius: 8px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Campus Arcana home">
      <span class="sigil" aria-hidden="true"><span>CA</span></span>
      <span class="brand-copy"><strong>Campus Arcana</strong><small>Field notes · Development log</small></span>
    </a>
    <span class="header-note">Real-time tactical magic</span>
  </header>
  <main>{{ .Content }}</main>
  <footer>Campus Arcana · Built with Godot · {{ now.Format "2006" }}</footer>
</body>
</html>
