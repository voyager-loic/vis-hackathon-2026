<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <style>
    body {
      background-color: #0b0c10;
      color: #c5c6c7;
      font-family: 'Courier New', Courier, monospace; /* Keeps that terminal/tech vibe! */
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    h1, h2, h3 {
      color: #66fcf1;
    }
    a {
      color: #45a29e;
    }
    blockquote {
      border-left: 3px solid #66fcf1;
      margin-left: 0;
      padding-left: 15px;
      color: #fff;
    }
    hr {
      border: 0;
      border-top: 1px solid #1f2833;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </main>
</body>
</html>
