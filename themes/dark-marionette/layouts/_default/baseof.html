<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ block "title" . }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <style>
    :root {
      --bg-color: #090b17;
      --card-bg: #161b34;
      --text-color: #b8bdd0;
      --accent-color: #b8a1ff;
      --highlight-color: #e9c66f;
      --teal: #67d9cb;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.7;
      margin: 0;
      padding: 0;
    }

    header {
      background: linear-gradient(180deg, #171c36 0%, var(--bg-color) 100%);
      padding: 2rem 1rem;
      text-align: center;
      border-bottom: 1px solid rgba(184, 161, 255, 0.28);
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
      color: #fff;
      letter-spacing: 2px;
      font-family: Georgia, 'Times New Roman', serif;
    }

    header p {
      color: var(--highlight-color);
      letter-spacing: 0.04em;
    }

    main {
      max-width: 850px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    article {
      background-color: rgba(22, 27, 52, 0.72);
      padding: 2rem;
      border-radius: 8px;
      border: 1px solid rgba(184, 161, 255, 0.18);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    h1, h2, h3 {
      color: var(--accent-color);
      font-family: Georgia, 'Times New Roman', serif;
    }

    h2 {
      border-bottom: 1px solid var(--highlight-color);
      padding-bottom: 0.5rem;
      margin-top: 2rem;
    }

    ul {
      padding-left: 1.2rem;
    }

    li {
      margin-bottom: 0.5rem;
    }

    code {
      background: #111;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      color: #ff79c6;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: #666;
      font-size: 0.9rem;
      border-top: 1px solid #1f2833;
      margin-top: 3rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>{{ .Site.Title }}</h1>
    <p>{{ .Site.Params.description }}</p>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    <p>&copy; {{ now.Format "2006" }} Dev Team. Powered by Hugo.</p>
  </footer>
</body>
</html>
