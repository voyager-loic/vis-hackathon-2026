<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <style>
video {
  max-width: 100%;       /* Prevents video from overflowing horizontally */
  max-height: 480px;     /* Prevents video from taking over the screen vertically */
  width: auto;
  height: auto;
  display: block;
  margin: 24px auto;     /* Centers the video container */
  border: 1px solid var(--dark-red);
  border-radius: 4px;
  box-shadow: 0 0 15px rgba(255, 30, 30, 0.15); /* Red glowing border matching theme */
  outline: none;
}
img {
    max-width: 100%;       /* Prevents image from stretching wider than the text column */
    max-height: 450px;     /* Limits the vertical height so it doesn't take over the screen */
    width: auto;           /* Maintains correct aspect ratio */
    height: auto;
    object-fit: contain;  /* Ensures the full image fits cleanly without cropping */
    display: block;
    margin: 24px auto;     /* Centers the image with vertical breathing room */
    border: 1px solid var(--dark-red);
    box-shadow: 0 0 12px rgba(255, 30, 30, 0.15); /* Subtle red glow matching your theme */
}
    :root {
      --bg-color: #050505;
      --text-color: #d1d1d1;
      --accent-red: #ff1e1e;
      --dark-red: #8b0000;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Courier New', Courier, monospace;
      max-width: 850px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.7;
    }

    h1, h2, h3 {
      color: var(--accent-red);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    h1 {
      border-bottom: 2px solid var(--dark-red);
      padding-bottom: 12px;
      margin-bottom: 30px;
      font-size: 2rem;
    }

    h2 {
      border-bottom: 1px solid rgba(139, 0, 0, 0.4);
      padding-bottom: 6px;
      margin-top: 40px;
    }

    a {
      color: var(--accent-red);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    blockquote {
      border-left: 3px solid var(--accent-red);
      margin-left: 0;
      padding-left: 15px;
      color: #fff;
      background: rgba(139, 0, 0, 0.05);
      padding: 10px 15px;
    }

    code {
      background: #150202;
      color: #ff6b6b;
      padding: 2px 6px;
      border-radius: 3px;
    }

    hr {
      border: 0;
      border-top: 1px solid var(--dark-red);
      margin: 30px 0;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </main>
</body>
</html>
